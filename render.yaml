services:
  - type: web
    plan: free
    name: AutoRenameBot
    env: docker
    repo: https://github.com/subhranilg7-png/Auto-Rename-Bot
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN
        sync: false
      - key: LOG_CHANNEL
        sync: false
      - key: START_PIC
        sync: false
